<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viral Ball / 比較サンプル</title><style>body{background:#080b18;color:#eef;font:16px system-ui;max-width:1000px;margin:30px auto;padding:16px}section{display:flex;flex-wrap:wrap;gap:16px}img,video{width:220px;max-width:100%;border-radius:16px}a{color:#62ffda}</style><a href="../../">← メーカーへ</a><h1>VIRAL BOUNCING BALL</h1><p>代表3種類。左：既存描画、中央：新描画、右：衝突音付き15秒MP4。シードは2 / 42 / 10。旧中心到達モードは存在しないため、同じシードの旧リング描画を比較対象に使用。</p><p>GitHub Actionsの実ブラウザで生成。iPhone実機・聴感上の同期は未検証。</p><div id="samples"></div><h2>20種類の終盤フレーム（シード10）</h2><p>時間切れを含め、計算された結果を表示しています。</p><div id="gallery"></div><a href="qa.json">録画計測・音声トラック検査結果</a><script>for(const m of ['escape','multiply','center']){const h=document.createElement('h2');h.textContent=m;document.querySelector('#samples').append(h);const s=document.createElement('section');for(const k of ['before','after']){const i=new Image();i.src=m+'-'+k+'.png';i.alt=k;s.append(i)}const v=document.createElement('video');v.src=m+'.mp4';v.controls=true;v.playsInline=true;v.preload='metadata';s.append(v);document.querySelector('#samples').append(s)}for(const m of ['escape','multiply','center','last','color','spiral','gravity','fusion','destroy','timing','oneexit','magnetic','shrink','reverse','race','chain','split','impossible','transform','ultimate']){const f=document.createElement('figure'),i=new Image();i.src='viral-'+m+'.png';i.alt=m;i.loading='lazy';const t=document.createElement('figcaption');t.textContent=m;f.append(i,t);document.querySelector('#gallery').append(f)}
</script></html>
