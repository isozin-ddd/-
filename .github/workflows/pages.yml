name: Publish Canvas app to GitHub Pages
on:
  push:
    branches: [main, viral-engine]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 'Pillow>=12,<13'
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python tests/test-custom-regression.py
      - run: python scripts/quality-capture.py --version before
      - run: python scripts/quality-capture.py --version after --modes escape
      - run: python scripts/quality-video-offset.py && python scripts/quality-metrics.py --measure-only && python scripts/quality-align-audio.py && python scripts/quality-metrics.py
      - run: python scripts/quality-capture.py --version after --modes multiply,last
      - run: python scripts/quality-video-offset.py && python scripts/quality-metrics.py --measure-only && python scripts/quality-align-audio.py && python scripts/quality-metrics.py
      - run: python tests/test-quality-ui.py
      - run: python scripts/quality-publish.py
      - run: python scripts/same-prompt-capture.py
      - run: python scripts/same-prompt-video-offset.py && python scripts/same-prompt-metrics.py --measure-only && python scripts/quality-align-audio.py --experiment && python scripts/same-prompt-metrics.py
      - run: python scripts/same-prompt-publish.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: same-prompt-audit
          path: reports/same-prompt
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-overhaul-audit
          path: reports/quality
          retention-days: 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public mobile UI and sample QA
        run: python scripts/quality-public-check.py && python scripts/same-prompt-public-check.py

  validate-branch:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0 'Pillow>=12,<13'
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python tests/test-custom-regression.py
      - run: python tests/test-quality-ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-ui-audit
          path: reports/quality
          retention-days: 3
